    weight_format: "BF16"
    bytes_per_param: 2.0
    checkpoint:
      revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
      total_params_b: 2.274
      language_model_b: 1.882
      vision_b: 0.331
      mtp_draft_b: 0.061
    sources:
      - https://huggingface.co/Qwen/Qwen3.5-2B
