  Qwen/Qwen3.5-4B:
    architecture: dense
    total_params_b: 4.206
    active_params_b: 4.206
    context_window: 262144       # card: "262,144 natively and extensible up to 1,010,000 tokens" (YaRN)
    stated: "4B; causal LM with vision encoder; 32 layers; LM output tied to token embedding"
    weight_format: "BF16"
    bytes_per_param: 2.0
    checkpoint:
      revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
      total_params_b: 4.660
      language_model_b: 4.206
      vision_b: 0.334
      mtp_draft_b: 0.121
    sources:
      - https://huggingface.co/Qwen/Qwen3.5-4B
      - https://huggingface.co/Qwen/Qwen3.5-4B/raw/main/config.json

  Qwen/Qwen3.5-9B:
    architecture: dense
    total_params_b: 8.954
    active_params_b: 8.954
    context_window: 262144       # card: "262,144 natively and extensible up to 1,010,000 tokens" (YaRN)
    stated: "9B; causal LM with vision encoder; 32 layers; untied LM output"
    weight_format: "BF16"
    bytes_per_param: 2.0
    checkpoint:
      revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
