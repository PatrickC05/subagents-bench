# Claude Sonnet 5.5 on Prime Inference, for `--model` (README, *Models*).
# Prices: USD per 1M tokens, from api.pinference.ai/api/v1/models on 2026-10-25.
# Prime lists no cache-read price for gateway models; its bills charged cached
# tokens at 10% of the input price (docs/DESIGN.md, *Providers*).
model: anthropic/claude-sonnet-5.5
provider: prime
temperature: 0.7
max_output_tokens: 32768
request_timeout_sec: 900         # no data for this long fails an attempt: OpenAI's models stream
                                 # nothing while they reason (docs/DESIGN.md, *Stall rule*)
retry_budget_sec: 1200           # more than request_timeout_sec: a stalled attempt is retried once
reasoning_effort: high           # every model at high reasoning (issue #23)
cache_control: true              # Anthropic caches nothing on Prime without breakpoints
price_in: 2
price_cache_read: 0.2
price_out: 10
