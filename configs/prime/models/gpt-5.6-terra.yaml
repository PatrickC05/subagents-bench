# GPT-5.6 Terra on Prime Inference, for `--model` (README, *Models*).
# Prices: USD per 1M tokens, from api.pinference.ai/api/v1/models on 2026-10-25.
# Prime lists no cache-read price for gateway models; its bills charged cached
# tokens at 10% of the input price (docs/DESIGN.md, *Providers*).
# Prime's price is OpenAI's from before its 2026-07-30 cut (direct: $2 / $12).
model: openai/gpt-5.6-terra
provider: prime
temperature: 0.7
max_output_tokens: 32768
reasoning_effort: high           # every model at high reasoning (issue #23)
price_in: 2.5
price_cache_read: 0.25
price_out: 15
