# Levels: the request kinds added one at a time on top of the bugs-only baseline (PR #13's plan
# comment; Jonathan's follow-up). Every level keeps the baseline's system prompt (replies: true puts
# the whole "Replying to the user" section in it) and differs from the level below only in the
# messages it sends:
#   L0 *_baseline   swe_interactive_baseline's three conditions, run again in this sweep
#   L1 *_eta        + a status check 2 min after bugs 1, 3 and 5 (6:00, 14:00, 22:00) listing the bugs so far
#   L2 *_questions  + 2 code questions after each bug (+80 s, +160 s; 12 per session)
#   L3 *_urgent     + bug 3 (12:00) is urgent ("fix it before the earlier ones")
# Bugs keep their send times (0, 4:00, ..., 20:00) and order at every level and in every round.
# For every condition: workspace snapshots (interactive.snapshots), so `subagents-bench fix-times`
# can grade each bug's real fix time afterwards, and reply rejects a reply to a bug that has neither
# eta_min nor done: true (interactive.require_eta).
# On Modal (swe_interactive_baseline_modal.yaml). Rounds 1-2 run every condition; rounds 3-4 only L2
# and L3 (the urgency comparison needs more pairs):
#   .venv/bin/subagents-bench questions configs/sweeps/swe_interactive_levels.yaml
#   scripts/run_experiment.sh configs/sweeps/swe_interactive_levels.yaml --rounds 1,2 --jobs-at-once 24
#   scripts/run_experiment.sh configs/sweeps/swe_interactive_levels.yaml --rounds 3,4 --jobs-at-once 12 \
#     --only single_questions manager_background_questions background_hinted_questions \
#            single_urgent manager_background_urgent background_hinted_urgent
#   .venv/bin/subagents-bench fix-times configs/sweeps/swe_interactive_levels.yaml
#   .venv/bin/subagents-bench grade-answers configs/sweeps/swe_interactive_levels.yaml
#   scripts/analyze.sh jobs/swe_interactive_levels
extends: configs/sweeps/swe_interactive_baseline_modal.yaml
name: swe_interactive_levels
rounds: 4

overrides:
  interactive:
    snapshots: true
    require_eta: true

# The three settings, as in swe_interactive_baseline.yaml (single_baseline, manager_background_baseline,
# background_hinted_baseline are inherited from it), at each level.
conditions:
  single_eta:
    topology: single
    interactive: {status_every: 2}
  manager_background_eta:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2}
  background_hinted_eta:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {status_every: 2}
  single_questions:
    topology: single
    interactive: {status_every: 2, questions_per_interval: 2}
  manager_background_questions:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2, questions_per_interval: 2}
  background_hinted_questions:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {status_every: 2, questions_per_interval: 2}
  single_urgent:
    topology: single
    interactive: {status_every: 2, questions_per_interval: 2, urgent_every: 3}
  manager_background_urgent:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2, questions_per_interval: 2, urgent_every: 3}
  background_hinted_urgent:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {status_every: 2, questions_per_interval: 2, urgent_every: 3}
