# Final study, experiment 2 (and experiment 1's L0): the three settings we report, at every level, on
# all six tasks in one sweep (issue #23). Same sessions as swe_interactive_levels + _more: 30 minutes,
# 6 bugs every 4 minutes in one fixed order, replies, snapshots and require_eta, on Modal, 1 round.
#   background_hinted   all five tools, told delegating long work keeps it free for the user
#   manager_background  read-only, so everything that runs or edits goes to subagents (no hint)
#   manager_owner       read-only, told to stay available and to put one subagent in charge of each bug
#                       (which may start up to 10 helpers)
# 3 settings x 4 levels = 12 jobs of 6 sessions (72). Experiment 1 runs only the L0 jobs (*_baseline).
# Another model: a spec with `extends: configs/sweeps/final_levels.yaml`, its own `name` and `base`.
# scripts/run_final.sh runs it end to end.
extends: configs/sweeps/swe_interactive_levels.yaml
inherit_conditions: false
name: final_levels
tasks:                               # language, bugs (the first 6 of the fixed order are sent)
  - swe-sweep__click                 # Python, 13
  - swe-sweep__echo                  # Go, 6
  - swe-sweep__dateutil              # Python, 10
  - swe-sweep__gin                   # Go, 11
  - swe-sweep__dayjs                 # JavaScript, 11
  - swe-sweep__luxon                 # JavaScript, 14
harbor:
  n_concurrent: 6                    # a job's six sessions at once
overrides:
  orchestrator:                      # subagents run the same model (base: subagent.model null)
    model: deepseek-ai/DeepSeek-V4.1-Flash-1017

conditions:
  # L0: bugs only
  background_hinted_baseline:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
  manager_background_baseline:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
  manager_owner_baseline:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true, owner_hint: true,
               max_children: 10}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
  # L1: + a status check asking for ETAs after bugs 1, 3 and 5
  background_hinted_eta:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {status_every: 2}
  manager_background_eta:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2}
  manager_owner_eta:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true, owner_hint: true,
               max_children: 10}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2}
  # L2: + 2 code questions after each bug
  background_hinted_questions:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {status_every: 2, questions_per_interval: 2}
  manager_background_questions:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2, questions_per_interval: 2}
  manager_owner_questions:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true, owner_hint: true,
               max_children: 10}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2, questions_per_interval: 2}
  # L3: + bug 3 (12:00) is urgent
  background_hinted_urgent:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {status_every: 2, questions_per_interval: 2, urgent_every: 3}
  manager_background_urgent:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2, questions_per_interval: 2, urgent_every: 3}
  manager_owner_urgent:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true, owner_hint: true,
               max_children: 10}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2, questions_per_interval: 2, urgent_every: 3}
