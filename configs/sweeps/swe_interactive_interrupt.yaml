# Interrupts: swe_interactive_levels.yaml's sessions (30 minutes on Modal, 1 round, snapshots and
# require_eta on) with interactive.interrupt on. A user message (a bug, a question, a status check)
# that comes due while the orchestrator's LLM call runs aborts the call (its partial reply is
# dropped) and is delivered at once; the orchestrator calls the model again with it. Never a call
# that has run under 5 s (interrupt_min_sec) or one already streaming a tool call, never more than 3
# calls in a row (interrupt_max_in_row), and a subagent report never interrupts (it is delivered with
# the message that does). Subagents are never interrupted. docs/DESIGN.md, *Interrupts*.
# The prompts are unchanged, so each condition pairs with the levels condition of the same setting and
# level (single_interrupt_questions with single_questions, ...), from swe_interactive_levels:
#   L0 *_interrupt_baseline   bugs only
#   L2 *_interrupt_questions  + status checks (after bugs 1, 3, 5) and 2 code questions after each bug
# Three settings: single, background_hinted, manager_background. Only these 6 conditions run
# (inherit_conditions: false). Tasks click and echo: 6 jobs, 12 sessions, all at once:
#   mkdir -p jobs/swe_interactive_interrupt/hints   # the levels sweep's code questions, reused:
#   cp ../sb-levels/jobs/swe_interactive_levels/hints/*.questions.json jobs/swe_interactive_interrupt/hints/
#   .venv/bin/subagents-bench questions configs/sweeps/swe_interactive_interrupt.yaml
#   scripts/run_experiment.sh configs/sweeps/swe_interactive_interrupt.yaml --jobs-at-once 6
#   .venv/bin/subagents-bench fix-times configs/sweeps/swe_interactive_interrupt.yaml
#   .venv/bin/subagents-bench grade-answers configs/sweeps/swe_interactive_interrupt.yaml
#   scripts/analyze.sh jobs/swe_interactive_interrupt
extends: configs/sweeps/swe_interactive_levels.yaml
inherit_conditions: false
name: swe_interactive_interrupt
rounds: 1

overrides:
  interactive:
    interrupt: true
    interrupt_min_sec: 5
    interrupt_max_in_row: 3

conditions:
  single_interrupt_baseline:
    topology: single
  manager_background_interrupt_baseline:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
  background_hinted_interrupt_baseline:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
  single_interrupt_questions:
    topology: single
    interactive: {status_every: 2, questions_per_interval: 2}
  manager_background_interrupt_questions:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {status_every: 2, questions_per_interval: 2}
  background_hinted_interrupt_questions:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {status_every: 2, questions_per_interval: 2}
