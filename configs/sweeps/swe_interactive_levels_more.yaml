# swe_interactive_levels.yaml on four more SWE-sweep tasks: with click and echo alone, each condition
# had one session per repository. Same 24 conditions (6 settings x 4 levels), same session, bug order
# (order_seed 0) and snapshots; only the tasks differ, so its jobs pool with swe_interactive_levels'
# for 6 sessions per condition. 24 jobs x 4 tasks = 96 sessions.
# The tasks, picked from 13 candidates by harbor's oracle on Modal (every bug resolved, no regression,
# for all 13) for fast grading (the fix-times replay grades every snapshot), clean first-6 bugs under
# hint_detail tests (each names files that exist in the image) and a mix of languages:
#   task                 language    bugs  oracle verifier (warm image)
#   swe-sweep__dateutil  Python      10    11 s
#   swe-sweep__gin       Go          11    24 s
#   swe-sweep__dayjs     JavaScript  11    30 s
#   swe-sweep__luxon     JavaScript  14    40 s
#   .venv/bin/subagents-bench questions configs/sweeps/swe_interactive_levels_more.yaml
#   scripts/run_experiment.sh configs/sweeps/swe_interactive_levels_more.yaml --jobs-at-once 24
#   .venv/bin/subagents-bench fix-times configs/sweeps/swe_interactive_levels_more.yaml
#   .venv/bin/subagents-bench grade-answers configs/sweeps/swe_interactive_levels_more.yaml
#   scripts/analyze.sh jobs/swe_interactive_levels jobs/swe_interactive_levels_more
extends: configs/sweeps/swe_interactive_levels.yaml
name: swe_interactive_levels_more
tasks:                               # language, bugs (the first 6 are sent)
  - swe-sweep__dateutil              # Python, 10
  - swe-sweep__gin                   # Go, 11
  - swe-sweep__dayjs                 # JavaScript, 11
  - swe-sweep__luxon                 # JavaScript, 14

harbor:
  n_concurrent: 4                    # the four sessions of a job at once (the base runs 3: click and echo)
