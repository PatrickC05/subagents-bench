# Harder bug reports: swe_interactive_levels.yaml at L0 (bugs only: no status checks, questions or
# urgent bug; snapshots and require_eta as there), but each bug is a user's report of what they saw
# (hint_detail: symptom) instead of the files and hidden tests to look at. A symptom report says what
# the user ran, what they expected and what happened; it names no source file, module path, private
# function or test (`subagents-bench hints` writes it from the hidden test patch and the reference fix
# and rewrites any that does), so the agent has to find where the bug is.
# Two variants of each setting, on the same 6 bugs in the same order:
#   <setting>_symptom  one bug per message, every 4 minutes (0:00, 4:00, ..., 20:00), as at L0
#   <setting>_web      the same bugs as two lists of 3 (interactive.bundle: 3), "a few things are
#                      broken: 1. ... 2. ... 3. ...": bugs 1-3 at 0:00 and bugs 4-6 at 20:00. The two
#                      sends keep the one-per-message schedule's first and last arrival and the same
#                      total time left for the bugs (3 x 30 + 3 x 10 = 120 bug-minutes, as 30 + 26 +
#                      ... + 10), so the variants differ in how the bugs arrive, not in the time to
#                      fix them. (Every 4 minutes, 0:00 and 4:00, would give every bug 8 more minutes.)
#                      The agent replies per bug with `reply(to, item, ...)`.
# The settings: single, background_hinted, manager_background, manager_available and manager_owner
# (swe_interactive_baseline.yaml). On Modal, 1 round, click and echo: 10 jobs, 20 sessions.
#   .venv/bin/subagents-bench hints configs/sweeps/swe_interactive_hard.yaml
#   scripts/run_experiment.sh configs/sweeps/swe_interactive_hard.yaml --jobs-at-once 10
#   .venv/bin/subagents-bench fix-times configs/sweeps/swe_interactive_hard.yaml
#   scripts/analyze.sh jobs/swe_interactive_hard
extends: configs/sweeps/swe_interactive_levels.yaml
inherit_conditions: false
name: swe_interactive_hard
rounds: 1

overrides:
  interactive:
    hint_detail: symptom

conditions:
  single_symptom: {topology: single}
  background_hinted_symptom:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
  manager_background_symptom:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
  manager_available_symptom:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
  manager_owner_symptom:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true, owner_hint: true,
               max_children: 10}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
  single_web:
    topology: single
    interactive: {bundle: 3, interval_sec: 1200}
  background_hinted_web:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, delegation_hint: true}
    interactive: {bundle: 3, interval_sec: 1200}
  manager_background_web:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {bundle: 3, interval_sec: 1200}
  manager_available_web:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {bundle: 3, interval_sec: 1200}
  manager_owner_web:
    subagent: {strategy: parallel, scope: hard, spawn_mode: background, availability_hint: true, owner_hint: true,
               max_children: 10}
    tools: {orchestrator_tools: [read_file, list_dir, search]}
    interactive: {bundle: 3, interval_sec: 1200}
