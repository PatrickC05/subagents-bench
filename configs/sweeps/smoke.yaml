# Smoke sweep (docs/DESIGN.md section 1): the pilot's 15 conditions on 2 easy
# tasks x 1 round = 30 episodes, 15 harbor jobs. Run it first to check the
# whole pipeline end to end (harbor + Docker + providers + analysis).
#
#   scripts/run_experiment.sh configs/sweeps/smoke.yaml
#   scripts/analyze.sh jobs/smoke
#
# `extends` deep-merges this file over the pilot spec, so `base` and the 15
# `conditions` are inherited unchanged; everything set here wins.

extends: configs/sweeps/pilot.yaml

name: smoke
dataset: terminal-bench@2.0
tasks:
  - fix-git
  - prove-plus-comm
rounds: 1
order_seed: 0

harbor:
  env: docker
  n_concurrent: 4
  agent_timeout_multiplier: 4.0
  extra_args: []

jobs_dir: jobs/smoke
