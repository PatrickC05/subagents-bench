[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subagents-bench"
version = "0.1.0"
description = "Cost and latency of a large orchestrator directing smaller subagents on executable coding tasks (Terminal-Bench 2.0 via harbor)."
readme = "README.md"
requires-python = ">=3.11"
# Runtime + analysis + plots. Exact versions are pinned in uv.lock
# (scripts/setup.sh installs from it with `uv sync --locked`, which also
# fails if uv.lock no longer matches this file).
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# The benchmark harness that runs the experiment (harbor run / dataset
# download). An extra, not a main dependency, because harbor 0.24.0 needs
# Python >= 3.12 and brings ~90 transitive packages, while aggregation and
# plotting work on any Python >= 3.11. scripts/setup.sh installs every extra.
harbor = ["harbor==0.24.0; python_version >= '3.12'"]
dev = ["pytest>=8.0"]
all = ["subagents-bench[harbor,dev]"]

[project.scripts]
subagents-bench = "subagents_bench.cli:main"

[tool.setuptools.packages.find]
include = ["subagents_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
